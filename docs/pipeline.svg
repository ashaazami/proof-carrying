<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

  <!-- The image carries its own light ground so it reads on GitHub light and dark. -->
  <rect width="1000" height="420" rx="10" fill="#f7f9fb"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#54657a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8562f"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b4c"/>
    </marker>
  </defs>

  <text x="34" y="40" font-size="17" font-weight="600" fill="#14181e">
    Generate aggressively, verify mechanically
  </text>
  <text x="34" y="62" font-size="13" fill="#5a6472">
    Only one step in this pipeline has to be trusted — and it is not the model.
  </text>

  <!-- ── boxes: y 100–188, under-labels at 210 ───────────────────────── -->

  <!-- 1. the statement -->
  <rect x="34" y="100" width="170" height="88" rx="7" fill="#ffffff" stroke="#c8d1dc"/>
  <text x="119" y="130" font-size="13.5" font-weight="600" fill="#14181e" text-anchor="middle">Theorem statement</text>
  <text x="119" y="152" font-size="11.5" fill="#5a6472" text-anchor="middle">what you want</text>
  <text x="119" y="169" font-size="11.5" fill="#5a6472" text-anchor="middle">to be true</text>
  <text x="119" y="210" font-size="11" fill="#8a94a3" text-anchor="middle">human judgement</text>

  <path d="M 210 144 L 250 144" stroke="#54657a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2. the model -->
  <rect x="256" y="100" width="170" height="88" rx="7" fill="#ffffff" stroke="#c8d1dc"/>
  <text x="341" y="130" font-size="13.5" font-weight="600" fill="#14181e" text-anchor="middle">LLM</text>
  <text x="341" y="152" font-size="11.5" fill="#5a6472" text-anchor="middle">drafts a proof in Lean —</text>
  <text x="341" y="169" font-size="11.5" fill="#5a6472" text-anchor="middle">plausible, not yet correct</text>
  <text x="341" y="210" font-size="11" fill="#8a94a3" text-anchor="middle">untrusted</text>

  <path d="M 432 144 L 472 144" stroke="#54657a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="452" y="134" font-size="10.5" fill="#5a6472" text-anchor="middle">candidate</text>

  <!-- 3. lean -->
  <rect x="478" y="100" width="170" height="88" rx="7" fill="#ffffff" stroke="#1d6b4c" stroke-width="1.7"/>
  <text x="563" y="130" font-size="13.5" font-weight="600" fill="#14181e" text-anchor="middle">Lean kernel</text>
  <text x="563" y="152" font-size="11.5" fill="#5a6472" text-anchor="middle">checks against the axioms,</text>
  <text x="563" y="169" font-size="11.5" fill="#5a6472" text-anchor="middle">accepts or refuses</text>
  <text x="563" y="210" font-size="11" font-weight="600" fill="#1d6b4c" text-anchor="middle">the only trusted step</text>

  <path d="M 654 144 L 694 144" stroke="#1d6b4c" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="674" y="134" font-size="10.5" fill="#1d6b4c" text-anchor="middle">accepted</text>

  <!-- 4. output -->
  <rect x="700" y="100" width="266" height="88" rx="7" fill="#ffffff" stroke="#c8d1dc"/>
  <text x="833" y="130" font-size="13.5" font-weight="600" fill="#14181e" text-anchor="middle">Verified program</text>
  <text x="833" y="152" font-size="11.5" fill="#5a6472" text-anchor="middle">compiled to C — the proof is erased,</text>
  <text x="833" y="169" font-size="11.5" fill="#5a6472" text-anchor="middle">costing nothing at runtime</text>
  <text x="833" y="210" font-size="11" fill="#8a94a3" text-anchor="middle">ordinary machine code</text>

  <!-- ── the loop, routed well below the under-labels ─────────────────── -->
  <path d="M 563 232 L 563 258 L 341 258 L 341 236"
        stroke="#a8562f" stroke-width="1.6" fill="none" stroke-dasharray="5 3"
        marker-end="url(#arrowRed)"/>
  <text x="452" y="276" font-size="11" fill="#a8562f" text-anchor="middle">
    rejected — back with the exact goal that failed
  </text>

  <!-- ── caption ─────────────────────────────────────────────────────── -->
  <text x="34" y="326" font-size="12.5" font-weight="600" fill="#14181e">The loop is the point.</text>
  <text x="34" y="348" font-size="12.5" fill="#5a6472">
    A refused proof returns the goal state that failed, so the next attempt answers real feedback rather than
  </text>
  <text x="34" y="367" font-size="12.5" fill="#5a6472">
    guesswork. Wrong attempts cost nothing; only a checked proof gets through.
  </text>
  <text x="34" y="396" font-size="12" fill="#8a94a3">
    What the kernel cannot check is whether the statement says what you meant — that stays with you.
  </text>
</svg>
